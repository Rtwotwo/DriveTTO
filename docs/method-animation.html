<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DriveTTO · SVG method animation</title>
<style>html,body{margin:0;background:#edf2ef;color:#173846;font-family:Arial,Helvetica,sans-serif}main{max-width:1600px;margin:0 auto}#stage{aspect-ratio:16/9;background:#f8faf9}#stage svg{width:100%;height:100%;display:block}nav{display:flex;gap:18px;align-items:center;padding:20px 3%;background:#fff}button,select{border:1px solid #d0ddda;border-radius:7px;background:#f7faf8;padding:9px 16px;color:inherit;font:inherit;cursor:pointer}input{flex:1;accent-color:#159b80}output{font-variant-numeric:tabular-nums;font-size:14px;min-width:95px}a{color:inherit;font-size:14px}@media(max-width:600px){nav{gap:8px;padding:12px}button,select{padding:7px}nav a{display:none}}</style></head>
<body><main><div id="stage" aria-label="Continuous SVG illustration of DriveTTO"></div><nav><button id="toggle" type="button">Play</button><input id="seek" aria-label="Time" type="range" min="0" max="167.999" step="0.01" value="0"><output id="time"></output><select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value=".5">0.5×</option></select><a href="index.html#algorithm">Project page</a></nav></main>
<script src="assets/animation/method-svg.js"></script><script>
const A=DriveTTOMotion,stage=document.getElementById('stage'),seek=document.getElementById('seek'),button=document.getElementById('toggle'),time=document.getElementById('time'),speed=document.getElementById('speed');
let t=Math.max(0,Math.min(167.999,Number(new URLSearchParams(location.search).get('t'))||0)),playing=false,previous;
function show(){stage.innerHTML=A.render(t);seek.value=t;time.textContent=Math.floor(t/60)+':'+String(Math.floor(t)%60).padStart(2,'0')+' / 2:48';}
button.onclick=()=>{if(t>=167.999)t=0;playing=!playing;button.textContent=playing?'Pause':'Play';previous=undefined};seek.oninput=()=>{t=Number(seek.value);show()};
function tick(now){if(playing){if(previous)t+=(now-previous)/1000*Number(speed.value);if(t>=168){t=167.999;playing=false;button.textContent='Replay'}show()}previous=now;requestAnimationFrame(tick)}show();requestAnimationFrame(tick);
</script></body></html>
